<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Accio — Hogwarts Academic</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <div class="stars" aria-hidden="true"></div>

    <header class="topbar">
      <div>
        <span class="eyebrow">HOGWARTS SCHOOL OF</span>
        <h1>PECULIAR MAGIC</h1>
      </div>
      <div class="avatar">V</div>
    </header>

    <section class="hero">
      <div class="hero-art">
        <div class="moon"></div>
        <div class="mountain mountain-back"></div>
        <div class="mountain mountain-front"></div>
        <div class="lake"></div>
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
      </div>

      <div class="hero-copy">
        <p class="date" id="todayDate"></p>
        <h2 id="greeting">Welcome, Valerie</h2>
        <p>What do you need today?</p>
      </div>
    </section>

    <section class="today-card">
      <div class="today-icon">✦</div>
      <div class="today-info">
        <span>Next activity</span>
        <strong>Ancient Runes</strong>
        <small>Teaching Week · Grade 2</small>
      </div>
      <div class="time">16.00</div>
    </section>

    <section class="section">
      <div class="section-heading">
        <h3>Academic today</h3>
        <button onclick="showToast('Schedule dibuka')">View all</button>
      </div>

      <div class="quick-list">
        <button class="quick-card" onclick="showToast('Schedule')">
          <span class="quick-icon">◷</span>
          <span>
            <b>Schedule</b>
            <small>2 classes today</small>
          </span>
          <span class="arrow">›</span>
        </button>

        <button class="quick-card" onclick="showToast('Assignments')">
          <span class="quick-icon">✎</span>
          <span>
            <b>Assignments</b>
            <small>3 tasks waiting</small>
          </span>
          <span class="arrow">›</span>
        </button>
      </div>
    </section>

    <section class="section">
      <div class="section-heading">
        <h3>Continue learning</h3>
      </div>

      <div class="lesson-card">
        <div>
          <span class="tag">ALCHEMY · GRADE 1</span>
          <h4>Attendance</h4>
          <p>Keep your academic record up to date.</p>
        </div>
        <button class="primary" onclick="showToast('Attendance opened')">Open</button>
      </div>
    </section>

    <nav class="bottom-nav">
      <button class="nav-item active" onclick="setActive(this)">
        <span>⌂</span><small>Home</small>
      </button>
      <button class="nav-item" onclick="setActive(this)">
        <span>◷</span><small>Schedule</small>
      </button>
      <button class="nav-item" onclick="setActive(this)">
        <span>✓</span><small>Tasks</small>
      </button>
      <button class="nav-item" onclick="setActive(this)">
        <span>◯</span><small>Profile</small>
      </button>
    </nav>

    <div id="toast" class="toast"></div>
  </main>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="app.js"></script>
</body>
</html>
